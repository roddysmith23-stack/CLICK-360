<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CLICK 360 PDF Provider QA</title>
  <link rel="stylesheet" href="../../styles.css">
  <script src="../../vendor/qrcode-generator.js"></script>
  <script src="../../vendor/jsbarcode.min.js"></script>
  <script src="../../vendor/html2pdf.bundle.min.js"></script>
  <script src="../../smart-print-core.js"></script>
  <script src="../../universal-label-canvas.js"></script>
  <script src="../../printing-service.js"></script>
</head>
<body>
  <button id="runPdf">Generar PDF QA</button>
  <button id="runReceiptPdf">Generar comprobante PDF QA</button>
  <script>
    (() => {
      const canvasApi = window.CLICK360_UNIVERSAL_LABEL_CANVAS;
      const product = { id:'pdf-provider-product', name:'QR Persistente', code:'PDF-QR-001', price:19.99 };
      const documentModel = canvasApi.normalizeDocument({
        paper:{ id:'qa-40x60', mediaType:'roll-1', widthMm:40, heightMm:60, mediaWidthMm:40, mediaHeightMm:60, columns:1, rows:1, dpi:203 },
        objects:[
          { id:'qr-main', type:'qr', xMm:3, yMm:3, widthMm:22, heightMm:22, z:1 },
          { id:'name-main', type:'name', xMm:4, yMm:29, widthMm:32, heightMm:7, z:2 },
          { id:'price-main', type:'price', xMm:4, yMm:39, widthMm:32, heightMm:8, z:2 },
          { id:'sku-main', type:'sku', xMm:4, yMm:50, widthMm:32, heightMm:5, z:2 }
        ],
        quantity:1,
        startSlot:1
      });
      async function buildNode() {
        const plan = canvasApi.buildPrintPlan([{ product, copies:documentModel.quantity }], documentModel, { startSlot:1 });
        const wrap = document.createElement('section');
        wrap.className = 'printLabels universalPrintLabels';
        wrap.dataset.renderer = 'universal-mm-v2';
        wrap.dataset.printPlan = canvasApi.planFingerprint(plan);
        for (const page of plan.pages) {
          const pageNode = document.createElement('section');
          pageNode.className = 'labelPrintPage';
          pageNode.style.cssText = 'position:relative;width:40mm;height:60mm;overflow:hidden;';
          for (const cell of page.cells) {
            if (cell.status !== 'filled') continue;
            const cellNode = document.createElement('div');
            cellNode.className = 'labelPrintCell filled';
            cellNode.style.cssText = `position:absolute;left:${cell.xMm}mm;top:${cell.yMm}mm;width:40mm;height:60mm;overflow:hidden;`;
            const canvas = document.createElement('canvas');
            await canvasApi.renderLabelToCanvas(canvas, documentModel, {
              product,
              price:'$19.99',
              sku:product.code,
              qrPayload:`CLICK360:${product.id}`
            });
            const image = document.createElement('img');
            image.src = canvas.toDataURL('image/png');
            image.alt = 'Etiqueta PDF QA';
            image.style.cssText = 'display:block;width:40mm;height:60mm;';
            cellNode.appendChild(image);
            pageNode.appendChild(cellNode);
          }
          wrap.appendChild(pageNode);
        }
        return { node:wrap, plan };
      }
      function buildReceiptHtml() {
        return `
          <section class="receiptPrintBody receiptPrintBody58" style="width:58mm;max-width:58mm;margin:0 auto;padding:2mm 2.4mm;box-sizing:border-box;background:#fff;color:#111;font:400 10px/1.28 ui-monospace,Menlo,Consolas,monospace;">
            <div style="text-align:center;margin-bottom:2mm;">
              <strong style="display:block;font-size:15px;line-height:1.1;">CLICK 360 QA</strong>
              <span>RUC/ID: 0999999999001</span><br>
              <span>Tel: +593 999 000 000</span>
            </div>
            <div style="border-top:1px dashed #111;border-bottom:1px dashed #111;text-align:center;font-weight:800;padding:1.2mm 0;margin-bottom:2mm;">COMPROBANTE DE VENTA</div>
            <dl style="display:grid;grid-template-columns:21mm 1fr;gap:.7mm 1.5mm;margin:0 0 2mm;">
              <dt>No.</dt><dd style="margin:0;text-align:right;">QA-0001</dd>
              <dt>Fecha/Hora</dt><dd style="margin:0;text-align:right;">01/08/26 12:00</dd>
              <dt>Metodo</dt><dd style="margin:0;text-align:right;">Efectivo</dd>
              <dt>Vendedor</dt><dd style="margin:0;text-align:right;">QA</dd>
            </dl>
            <table style="width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:2mm;">
              <thead>
                <tr style="border-top:1px dashed #111;border-bottom:1px dashed #111;">
                  <th style="text-align:left;padding:1mm 0;">Detalle</th>
                  <th style="width:10mm;text-align:center;padding:1mm 0;">Cant</th>
                  <th style="width:15mm;text-align:right;padding:1mm 0;">Total</th>
                </tr>
              </thead>
              <tbody>
                <tr><td style="padding:1mm 0;overflow-wrap:anywhere;">Producto QA</td><td style="text-align:center;">1</td><td style="text-align:right;">$19.99</td></tr>
              </tbody>
            </table>
            <div style="border-top:1px dashed #111;padding-top:1.2mm;">
              <div style="display:flex;justify-content:space-between;"><span>Total</span><strong>$19.99</strong></div>
              <div style="display:flex;justify-content:space-between;"><span>Recibido</span><span>$20.00</span></div>
              <div style="display:flex;justify-content:space-between;"><span>Vuelto</span><span>$0.01</span></div>
            </div>
            <footer style="border-top:1px dashed #111;margin-top:2mm;padding-top:1.2mm;text-align:center;font-size:9px;overflow-wrap:anywhere;">
              Control total de tu negocio con CLICK 360.
              <br>Comprobante interno. No valido como factura electronica.
            </footer>
          </section>
        `;
      }
      window.__CLICK360_PDF_PROVIDER_QA__ = {
        async run() {
          const built = await buildNode();
          if (!built.node.querySelector('img')) throw new Error('No printable image was generated.');
          return window.CLICK360_PRINTING.print('pdf', {
            node:built.node,
            media:'label',
            mediaWidthMm:40,
            mediaHeightMm:60,
            widthMm:40,
            heightMm:60,
            copiesHandled:true,
            printPlan:built.plan,
            filename:'click360-pdf-provider-qa.pdf'
          });
        },
        async runReceipt() {
          return window.CLICK360_PRINTING.print('pdf', {
            html:buildReceiptHtml(),
            media:'receipt-58',
            mediaWidthMm:58,
            widthMm:58,
            copiesHandled:true,
            filename:'click360-receipt-pdf-provider-qa.pdf'
          });
        }
      };
      document.getElementById('runPdf').onclick = () => window.__CLICK360_PDF_PROVIDER_QA__.run();
      document.getElementById('runReceiptPdf').onclick = () => window.__CLICK360_PDF_PROVIDER_QA__.runReceipt();
      document.documentElement.dataset.ready = 'true';
    })();
  </script>
</body>
</html>
