name: CLICK 360 QA

on:
  pull_request:
  push:
    branches: [main, feat/v16-commercial-beta]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.scope.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -Eq '^(tools/admin/|scripts/admin-tool-wrapper\.mjs|scripts/(admin-access-v16|audit-firestore-legacy|migrate-legacy-v9-to-v10|normalize-approved-owner-access)\.mjs|\.github/workflows/p0-qa\.yml)'; then
            echo 'admin=true' >> "$GITHUB_OUTPUT"
          else
            echo 'admin=false' >> "$GITHUB_OUTPUT"
          fi

  web-runtime-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run qa
      - run: npm run qa:rules
      - run: npm run qa:simulator:quick
      - run: npm run qa:simulator:full
      - run: npm run build:static
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Basic secret check
        run: |
          ! git grep -nE '(BEGIN PRIVATE KEY|private_key"[[:space:]]*:)' -- . ':!tools/admin/fixtures/**' ':!vendor/**' ':!.github/workflows/p0-qa.yml'

  admin-fixture-qa:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/admin/package-lock.json
      - run: npm ci
      - run: npm run qa:fixtures

  admin-security-audit:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/admin/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
