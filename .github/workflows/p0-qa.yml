name: CLICK 360 QA

on:
  pull_request:
  push:
    branches: [main, feat/v16-commercial-beta]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.scope.outputs.admin }}
      functions: ${{ steps.scope.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(tools/admin/|scripts/admin-tool-wrapper\.mjs|scripts/(admin-access-v16|audit-firestore-legacy|migrate-legacy-v9-to-v10|normalize-approved-owner-access)\.mjs|\.github/workflows/p0-qa\.yml)'; then
            echo 'admin=true' >> "$GITHUB_OUTPUT"
          else
            echo 'admin=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^functions/'; then
            echo 'functions=true' >> "$GITHUB_OUTPUT"
          else
            echo 'functions=false' >> "$GITHUB_OUTPUT"
          fi

  web-runtime-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa
      - name: Basic secret check
        run: |
          ! git grep -nE '(BEGIN PRIVATE KEY|private_key"[[:space:]]*:)' -- . ':!tools/admin/fixtures/**' ':!vendor/**' ':!.github/workflows/p0-qa.yml'

  web-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  web-rules-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run qa:rules

  web-simulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:simulator:quick
      - run: npm run qa:simulator:full

  labels-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes --package @playwright/cli playwright-cli install-browser webkit
      - run: npm run qa:labels:e2e

  web-safe-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:p2:web-safe
      - run: npm run qa:p2:web-admin-boundary
      - run: npm run build:static

  admin-fixture-qa:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/admin/package-lock.json
      - run: npm ci
      - run: npm run qa:fixtures

  admin-security-audit:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/admin/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  functions-qa:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f functions/package.json
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
