name: CLICK 360 1.0.5 Web Release QA

on:
  pull_request:
  push:
    branches: [main, feat/v16-commercial-beta]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.scope.outputs.admin }}
      functions: ${{ steps.scope.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          # admin-access-v16.mjs intentionally excluded: the Commercial MVP
          # release scopes in CEO Admin activation/onboarding tooling as a
          # reviewed, first-class part of this release. See the matching
          # change in qa-1-0-5-web-release-harness.cjs for the same reasoning.
          if printf '%s\n' "$changed" | grep -Eq '^(tools/admin/|scripts/(audit-firestore-legacy|migrate-legacy-v9-to-v10|normalize-approved-owner-access)\.mjs)'; then
            echo 'admin=true' >> "$GITHUB_OUTPUT"
          else
            echo 'admin=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^functions/'; then
            echo 'functions=true' >> "$GITHUB_OUTPUT"
          else
            echo 'functions=false' >> "$GITHUB_OUTPUT"
          fi

  web-runtime-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run qa
      - name: Basic secret check
        run: |
          ! git grep -nE '(BEGIN PRIVATE KEY|private_key"[[:space:]]*:)' -- . ':!fixtures/**' ':!vendor/**' ':!.github/workflows/p0-qa.yml'

  web-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  web-rules-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run qa:rules

  web-simulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:simulator:quick
      - run: npm run qa:simulator:full

  labels-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install PDF rendering tools
        run: brew install poppler
      - run: npx --no-install playwright install chromium webkit firefox
      - run: npm run qa:integration

  admin-jobs:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reject administrative scope in web release
        run: |
          echo "Administrative changes are outside this web-only release."
          exit 1

  inventory-conflict-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx --no-install playwright install chromium webkit
      - name: Thirty real same-product races, independent server verification
        run: node qa/r37-2-5-two-device-same-product-conflict-e2e.mjs

  recovery-tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build isolated Windows acquisition package (synthetic identity only)
        run: python scripts/recovery/build_acquisition_package.py --config scripts/recovery/synthetic-acquisition-config.json --output recovery-package-ci
      - name: Run packaged parser against synthetic evidence on Windows
        run: recovery-package-ci/SHARY_PC_ACQUISITION_PACKAGE/runtime/python.exe recovery-package-ci/SHARY_PC_ACQUISITION_PACKAGE/test_acquisition.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - name: Verify real Chromium serialization and external blobs with packaged runtime
        env:
          CLICK360_RECOVERY_PYTHON: ${{ github.workspace }}/recovery-package-ci/SHARY_PC_ACQUISITION_PACKAGE/runtime/python.exe
        run: node qa/recovery-parser-browser-e2e.mjs

  functions-jobs:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reject Functions scope in web release
        run: |
          echo "Functions changes are outside this web-only release."
          exit 1

  web-release-gate:
    if: always()
    needs:
      - web-runtime-qa
      - web-audit
      - web-rules-qa
      - web-simulators
      - labels-e2e
      - recovery-tooling
      - inventory-conflict-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Emit release decision
        env:
          WEB_RUNTIME: ${{ needs.web-runtime-qa.result }}
          WEB_AUDIT: ${{ needs.web-audit.result }}
          RULES_QA: ${{ needs.web-rules-qa.result }}
          SIMULATORS: ${{ needs.web-simulators.result }}
          LABELS: ${{ needs.labels-e2e.result }}
          RECOVERY: ${{ needs.recovery-tooling.result }}
          CONFLICTS: ${{ needs.inventory-conflict-e2e.result }}
        run: |
          results="$WEB_RUNTIME $WEB_AUDIT $RULES_QA $SIMULATORS $LABELS $RECOVERY $CONFLICTS"
          if [ "$results" != "success success success success success success success" ]; then
            echo "NO_GO"
            echo "Required web checks: $results"
            exit 1
          fi
          echo "GO"
