name: CLICK 360 Label Stability r29

on:
  push:
    branches:
      - hotfix/1.0.5-stability-label-regression

permissions:
  contents: write

concurrency:
  group: click360-label-stability-r29-${{ github.ref }}
  cancel-in-progress: false

jobs:
  labels-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.0.5-stability-label-regression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install PDF verification tool
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Playwright browser engines
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Apply guarded mobile wizard footer fix
        run: python3 scripts/apply-label-wizard-mobile-footer-fix.py
      - name: Exact quantity and second-slot regression
        run: |
          node qa-stability-label-r29.cjs
          node qa-p1-5c-exact-copy-harness.cjs
          node qa-p1-5c-paper-geometry-harness.cjs
      - name: Existing label engine E2E
        run: npm run qa:labels:e2e
      - name: Static build
        run: npm run build:static
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit verified label layout fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          if git diff --cached --quiet; then
            echo 'No label runtime changes to commit.'
            exit 1
          fi
          git commit -m 'fix(labels): keep mobile wizard body above footer'
          git push origin HEAD:hotfix/1.0.5-stability-label-regression
