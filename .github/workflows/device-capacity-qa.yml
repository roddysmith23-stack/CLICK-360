name: Device cloud capacity regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  device-capacity-required:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run qa:capacity
      - run: node qa-p0a-release-boundary.mjs
      - run: node qa-p0a-auth-epoch.mjs
      - run: node qa-p0a-journal-e2e.mjs
      - run: node qa-p0a-recovery-e2e.mjs
      - run: npm run qa:capacity:e2e
      - run: npm run build:static
      - run: node qa/founder-opening-readiness-e2e.mjs
      - run: node qa/founder-hosted-commerce-e2e.mjs
      - name: Preserve a real previous PWA build for upgrade regression
        run: |
          git worktree add --detach "$RUNNER_TEMP/click360-before-founder" 6f83372c89fc44a000a1f30876998d3522dbd6d2
          cd "$RUNNER_TEMP/click360-before-founder"
          node scripts/build-static-release.mjs
          git worktree add --detach "$RUNNER_TEMP/click360-before-capacity" dc77604d9a9f9dd602a61b24a20c5070eee853c7
          cd "$RUNNER_TEMP/click360-before-capacity"
          node scripts/build-static-release.mjs
      - run: node qa/founder-pwa-upgrade-e2e.mjs
        env:
          CLICK360_OLD_BUILD_DIR: ${{ runner.temp }}/click360-before-founder/dist
      - run: node qa/founder-pwa-upgrade-e2e.mjs
        env:
          CLICK360_OLD_BUILD_DIR: ${{ runner.temp }}/click360-before-capacity/dist
      - name: Preserve exact production PWA before P0A
        run: |
          git worktree add --detach "$RUNNER_TEMP/click360-before-p0a" 21409a1d2dc710315ab8c3c27e5da566f004cc8e
          cd "$RUNNER_TEMP/click360-before-p0a"
          node scripts/build-static-release.mjs
      - run: node qa/founder-pwa-upgrade-e2e.mjs
        env:
          CLICK360_OLD_BUILD_DIR: ${{ runner.temp }}/click360-before-p0a/dist
      - name: Preserve the published recovery-only PWA before operational release
        run: |
          git worktree add --detach "$RUNNER_TEMP/click360-p0a-production" 9090f2105d17f2b10e2dd97bab7a548df671597b
          cd "$RUNNER_TEMP/click360-p0a-production"
          node scripts/build-static-release.mjs
      - run: node qa/founder-pwa-upgrade-e2e.mjs
        env:
          CLICK360_OLD_BUILD_DIR: ${{ runner.temp }}/click360-p0a-production/dist
