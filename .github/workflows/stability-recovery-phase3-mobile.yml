name: CLICK 360 Stability Recovery Phase 3 Mobile

on:
  push:
    branches:
      - hotfix/1.0.5-stability-mobile-reports

permissions:
  contents: write

concurrency:
  group: click360-stability-phase3-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.0.5-stability-mobile-reports
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Apply guarded mobile/reports/calculator patch
        run: python3 scripts/apply-stability-recovery-phase3-mobile-reports.py
      - name: Syntax and source contracts
        run: |
          node --check app.js
          node qa-stability-recovery-phase3-mobile.cjs
          node qa-p1-1b-sync-guard-harness.cjs
          node qa-p1-1c-reliability-sync-recovery-harness.cjs
          node qa-stability-recovery-phase2-workers.cjs
      - name: Mobile browser QA
        run: node qa/stability-mobile-r29-e2e.mjs
      - name: Existing cross-browser visual QA
        run: node qa/visual-browser-e2e.mjs
      - name: Business simulator quick
        run: npm run qa:simulator:quick
      - name: Static build
        run: npm run build:static
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit verified mobile fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css
          if git diff --cached --quiet; then
            echo 'No mobile runtime changes to commit.'
            exit 1
          fi
          git commit -m 'fix(mobile): stabilize finance reports and calculator PiP'
          git push origin HEAD:hotfix/1.0.5-stability-mobile-reports
