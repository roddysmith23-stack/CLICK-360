name: CLICK 360 Stability Release r29 Apply

on:
  push:
    branches:
      - hotfix/1.0.5-stability-release-r29

permissions:
  contents: write

concurrency:
  group: click360-stability-release-r29-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.0.5-stability-release-r29
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply already-validated r29 runtime unification
        run: python3 scripts/apply-stability-recovery-phase4-release-r29.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check firebase-service.js
          node --check runtime-guard.js
          node --check service-worker.js
      - name: Build and verify release contract
        run: |
          npm run build:static
          node qa-release-version-r29.cjs
      - name: Inherited recovery contracts
        run: |
          node qa-stability-recovery-phase1.cjs
          node qa-p1-1b-sync-guard-harness.cjs
          node qa-p1-1c-reliability-sync-recovery-harness.cjs
          node qa-stability-recovery-phase2-workers.cjs
          node qa-stability-recovery-phase3-mobile.cjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit coherent runtime release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js firebase-service.js runtime-guard.js service-worker.js index.html styles.css manifest.webmanifest
          if git diff --cached --quiet; then
            echo 'No release runtime changes to commit.'
            exit 1
          fi
          git commit -m 'fix(release): unify CLICK 360 1.0.5 runtime assets on r29'
          git push origin HEAD:hotfix/1.0.5-stability-release-r29
