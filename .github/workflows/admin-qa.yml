name: CLICK 360 Admin Tools QA

on:
  pull_request:
  push:
    branches: [main, feat/v16-commercial-beta]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.scope.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          files="$(git diff --name-only "$base" "$GITHUB_SHA")"

          # Package checks are driven by the package surface, never by P2
          # Functions. A workflow-only edit is checked when it is isolated;
          # this prevents a Functions PR from inheriting the admin audit.
          admin_code=false
          admin_workflow=false
          non_admin_runtime=false
          if printf '%s\n' "$files" | grep -Eq '^(tools/admin/.*|scripts/admin-tool-wrapper\.mjs|scripts/(admin-access-v16|audit-firestore-legacy|migrate-legacy-v9-to-v10|normalize-approved-owner-access)\.mjs)$'; then admin_code=true; fi
          if printf '%s\n' "$files" | grep -Eq '^\.github/workflows/admin-qa\.yml$'; then admin_workflow=true; fi
          if printf '%s\n' "$files" | grep -Eq '^(functions/.*|firestore\.p2\.staging\.rules|firebase\.p2-emulator\.json|scripts/run-p2-cloud-.*\.sh|qa-p2-cloud-.*\.cjs|qa/fixtures/p2-cloud-.*|p2-cloud-.*\.js|.*-repository\.js|\.github/workflows/web-functions-qa\.yml)$'; then non_admin_runtime=true; fi

          if [ "$admin_code" = true ] || { [ "$admin_workflow" = true ] && [ "$non_admin_runtime" = false ]; }; then
            echo 'admin=true' >> "$GITHUB_OUTPUT"
          else
            echo 'admin=false' >> "$GITHUB_OUTPUT"
          fi

  admin-fixture-qa:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/admin/package-lock.json
      - run: npm ci
      - run: npm run qa:fixtures

  admin-security-audit:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/admin/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
