name: Spark modular client safety regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spark-client-safety-required:
    runs-on: ubuntu-latest
    env:
      CLICK360_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qa:spark
      - run: npm run qa:spark:rules
      - run: npm run qa:spark:legacy-rules
      - name: Repeat client transactions and lifecycle with a fresh emulator
        run: npm run qa:spark:rules
      - name: Certify worst-case Rules with stricter expression headroom
        env:
          SPARK_RULES_HEADROOM_PROBE: 'true'
        run: npm run qa:spark:rules
      - name: Preserve sanitized exact-source Rules evidence
        uses: actions/upload-artifact@v4
        with:
          name: spark-rules-proof
          path: artifacts/spark-rules-proof/*.json
          if-no-files-found: error
      - run: npm run qa:modular-persistence
      - name: Existing served PWA against real client Rules in Chromium and WebKit
        run: npm run qa:spark:ui
      - name: Preserve served PWA operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-served-operational-ui
          path: output/playwright/spark-operational-ui/
          if-no-files-found: error
      - run: npm audit --omit=dev --audit-level=moderate
