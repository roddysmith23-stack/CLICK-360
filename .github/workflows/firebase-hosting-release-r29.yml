name: CLICK 360 Firebase Hosting Release r29

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/firebase-hosting-release-r29.yml'

permissions:
  contents: read

concurrency:
  group: click360-firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy-hosting:
    if: ${{ github.event.head_commit.message == 'deploy: CLICK 360 1.0.5 r29 to Firebase Hosting' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata before build
        run: |
          grep -q "commercial-1-0-5-r29" app.js
          grep -q "commercial-1-0-5-r29" service-worker.js
          echo "Release metadata r29 confirmed."

      - name: Build static release
        run: npm run build:static

      - name: Verify built artifact
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/service-worker.js
          grep -q "commercial-1-0-5-r29" dist/app.js
          grep -q "commercial-1-0-5-r29" dist/service-worker.js
          echo "Built artifact is CLICK 360 1.0.5 r29."

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLICK_360 }}

      - name: Deploy Firebase Hosting only
        run: npx firebase-tools deploy --only hosting --project click-360 --non-interactive

      - name: Confirm no Rules or Functions deployment requested
        run: echo 'Deployment scope completed: Firebase Hosting only.'
