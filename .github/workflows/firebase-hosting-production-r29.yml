name: CLICK 360 Production Hosting Deploy r29

on:
  push:
    branches:
      - ops/deploy-1.0.5-r29-live

permissions:
  contents: read

concurrency:
  group: click360-production-hosting-r29
  cancel-in-progress: false

jobs:
  deploy-hosting-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout authorized release
        uses: actions/checkout@v4
        with:
          ref: ops/deploy-1.0.5-r29-live

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact static release
        run: npm run build:static

      - name: Verify r29 release contract
        run: node qa-release-version-r29.cjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Deploy Firebase Hosting only
        env:
          FIREBASE_SERVICE_ACCOUNT_CLICK_360: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLICK_360 }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          SA_JSON=""
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_CLICK_360:-}" ]; then
            SA_JSON="$FIREBASE_SERVICE_ACCOUNT_CLICK_360"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            SA_JSON="$FIREBASE_SERVICE_ACCOUNT"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            SA_JSON="$GOOGLE_APPLICATION_CREDENTIALS_JSON"
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            SA_JSON="$GCP_SA_KEY"
          fi

          if [ -n "$SA_JSON" ]; then
            CRED_FILE="$RUNNER_TEMP/firebase-click360-service-account.json"
            printf '%s' "$SA_JSON" > "$CRED_FILE"
            chmod 600 "$CRED_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$CRED_FILE"
            npx --no-install firebase deploy --only hosting --project click-360 --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --no-install firebase deploy --only hosting --project click-360 --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo 'NO_FIREBASE_CREDENTIALS_AVAILABLE_IN_REPOSITORY_SECRETS'
            exit 78
          fi

      - name: Verify live production is r29
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            stamp="$(date +%s)-$attempt"
            index="$(curl -fsSL --retry 2 --connect-timeout 10 "https://click-360.web.app/?verify=$stamp" || true)"
            guard="$(curl -fsSL --retry 2 --connect-timeout 10 "https://click-360.web.app/runtime-guard.js?verify=$stamp" || true)"
            if printf '%s\n%s' "$index" "$guard" | grep -q 'commercial-1-0-5-r29'; then
              echo 'CLICK360_PRODUCTION_R29_VERIFIED'
              exit 0
            fi
            sleep 4
          done
          echo 'CLICK360_PRODUCTION_R29_NOT_VISIBLE_AFTER_DEPLOY'
          exit 1
