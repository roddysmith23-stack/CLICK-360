  <script>
    (() => {
      const startedAt = Date.now();
      const minimumIntroMs = 5000;
      const maximumIntroMs = 12000;
      let completed = false;
      let pollTimer = null;
      let hardFallbackTimer = null;
      // States in which the Firebase service layer has already shown the
      // user a specific, actionable message (login buttons, "pending
      // approval", "blocked", an explicit error, etc.) via the auth gate --
      // these are NOT a stall, even though #app itself has no children (the
      // gate renders as a sibling of #app, appended directly to <body>, so a
      // perfectly healthy unauthenticated visitor also has an empty #app).
      // Deliberately excludes READY/ONLINE_ONLY_SAFE: those mean the app
      // SHOULD be visibly rendering into #app right now -- if it still isn't
      // by the hard-fallback deadline, that is exactly the stuck case this
      // exists to catch (e.g. the main application script failed to load or
      // parse while the Firebase service layer itself came up fine and
      // unlocked the gate).
      // LOADING/AUTHENTICATED_RESOLVING are excluded for the same reason:
      // still in flight past the deadline is itself worth surfacing.
      const SAFE_TERMINAL_GATE_STATES = new Set([
        'unauthenticated', 'pending', 'blocked', 'recoverable_error',
        'invalid_invitation', 'authenticated_no_access', 'identity_reconciliation_required'
      ]);
      const appHasRendered = () => {
        const app = document.getElementById('app');
        if (app && app.children.length) return true;
        const uiState = String(window.click360AccessUiState?.state || '').toLowerCase();
        return SAFE_TERMINAL_GATE_STATES.has(uiState);
      };
      const fadeOutSplash = (splash) => {
        const delay = Math.max(0, minimumIntroMs - (Date.now() - startedAt));
        setTimeout(() => {
          splash.classList.add('ready');
          setTimeout(() => splash.remove(), 920);
        }, delay);
      };
      const finish = () => {
        if (completed) return;
        completed = true;
        if (pollTimer) clearInterval(pollTimer);
        if (hardFallbackTimer) clearTimeout(hardFallbackTimer);
        const splash = document.getElementById('click360Splash');
        if (!splash) return;
        fadeOutSplash(splash);
      };
      const finishWhenAppRendered = () => {
        if (appHasRendered()) finish();
      };
      // r36 P0 fix: previously the splash was removed unconditionally at the
      // hard-fallback timeout even if #app never rendered anything, leaving a
      // fully black screen with no visible way to recover (SHARY incident).
      // Now, if #app is STILL empty when the hard fallback fires, replace the
      // splash with an explicit recovery screen instead of silently
      // uncovering nothing. This is independent of whatever caused the boot
      // to stall -- it is a floor, not a diagnosis.
      const showBootRecovery = () => {
        if (completed) return;
        completed = true;
        if (pollTimer) clearInterval(pollTimer);
        const splash = document.getElementById('click360Splash');
        if (!splash) return;
        let errorCode = '';
        try { errorCode = window.CLICK360_LAST_RUNTIME_ERROR?.reportId || ''; } catch (e) {}
        const waMessage = encodeURIComponent(
          'Necesito ayuda con CLICK 360, no pudo iniciar.' + (errorCode ? ' Codigo: ' + errorCode + '.' : '')
        );
        splash.innerHTML =
          '<strong>CLICK 360 no pudo iniciar</strong>' +
          '<p class="click360BootRecoveryMsg">Tu informacion sigue protegida en la nube. Prueba estas opciones:</p>' +
          (errorCode ? '<small class="click360BootRecoveryCode">Codigo: ' + errorCode + '</small>' : '') +
          '<div class="click360BootRecoveryActions">' +
          '<button type="button" id="click360BootRetry" class="click360BootRecoveryBtn">Reintentar</button>' +
          '<button type="button" id="click360BootUpdate" class="click360BootRecoveryBtn primary">Actualizar aplicacion</button>' +
          '<a href="https://wa.me/593969399562?text=' + waMessage + '" target="_blank" rel="noopener noreferrer" class="click360BootRecoveryBtn">Reportar problema</a>' +
          '</div>';
        splash.classList.add('click360BootRecovery');
        document.getElementById('click360BootRetry')?.addEventListener('click', () => { location.reload(); });
        // r37.2.1 (LIVE CLIENT RECOVERY -- safe update): this used to
        // unregister EVERY service worker registration and delete every
        // click360- cache BEFORE ever confirming a new version could
        // actually be downloaded -- if the network was the reason boot
        // stalled in the first place (the most likely case, since this
        // screen only appears after boot already failed), the customer was
        // left with NOTHING: no worker, no cache, nothing to serve the
        // reload. That is the exact "No se puede acceder a este sitio" ->
        // blank screen a real customer hit. Now this uses the SAME
        // PREPARE->COMMIT->ROLLBACK engine as repair.html (safe-update.js,
        // loaded above, self-contained -- works even though the main
        // application bundle may be exactly what failed to load).
        document.getElementById('click360BootUpdate')?.addEventListener('click', () => {
          const btn = document.getElementById('click360BootUpdate');
          const msg = document.querySelector('.click360BootRecoveryMsg');
          if (btn) { btn.disabled = true; btn.textContent = 'Verificando conexión...'; }
          if (typeof window.click360SafeUpdate !== 'function') {
            if (msg) msg.textContent = 'Abre click360.app/repair.html para actualizar de forma segura.';
            if (btn) { btn.disabled = false; btn.textContent = 'Actualizar aplicacion'; }
            return;
          }
          window.click360SafeUpdate({
            onLog: function (message) {
              if (btn && (message.indexOf('Registrando') === 0 || message.indexOf('Actualizando el service worker') === 0)) {
                btn.textContent = 'Descargando actualización...';
              }
            }
          }).then((result) => {
            if (result.ok) { location.replace('/?repaired=' + Date.now()); return; }
            if (msg) msg.textContent = result.message + ' Tu versión actual sigue funcionando; no se eliminó nada.';
            if (btn) { btn.disabled = false; btn.textContent = 'Reintentar actualización'; }
          });
        });
        // The recovery screen is a floor, not a dead end: if the boot was
        // merely SLOW (a real, if unusually long, network round-trip to
        // Auth/Firestore) rather than genuinely stuck, and it goes on to
        // finish successfully after the hard-fallback already fired, don't
        // strand the user staring at "no pudo iniciar" while the app is
        // actually fine underneath. Keep watching for up to a further 60s;
        // if the real content shows up, quietly swap back to it.
        let graceElapsedMs = 0;
        const graceTimer = setInterval(() => {
          graceElapsedMs += 500;
          if (appHasRendered()) {
            clearInterval(graceTimer);
            splash.classList.remove('click360BootRecovery');
            fadeOutSplash(splash);
            return;
          }
          if (graceElapsedMs >= 60000) clearInterval(graceTimer);
        }, 500);
      };
      window.click360MarkSplashReady = finish;
      window.addEventListener('click360:ready', finish, { once: true });
      pollTimer = setInterval(finishWhenAppRendered, 350);
      hardFallbackTimer = setTimeout(() => {
        if (appHasRendered()) finish(); else showBootRecovery();
      }, maximumIntroMs);
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(finishWhenAppRendered, minimumIntroMs);
      }, { once: true });
      window.addEventListener('load', finishWhenAppRendered, { once: true });
    })();
  </script>

<script>
  if ('serviceWorker' in navigator) {
    const hadServiceWorkerController = !!navigator.serviceWorker.controller;
    // r37 (Section 5, automatic self-heal): a new active Service Worker
    // means fresh assets are already cached and ready -- the client used to
    // ONLY show a passive "will apply next time you open CLICK 360" toast,
    // requiring the customer to notice and manually close/reopen the app.
    // Now it self-heals by reloading automatically, but ONLY when it is
    // safe to do so (no modal open, sitting on the neutral #home route --
    // never mid-sale or mid-form) and AT MOST ONCE per session (a
    // sessionStorage flag, not localStorage, so it never loops and always
    // resets on the next real session). If it is not safe right now, it
    // falls back to the original passive toast -- never forces a reload
    // over a possible unsaved draft.
    const AUTO_HEAL_SESSION_KEY = 'CLICK360_SW_AUTO_HEAL_DONE';
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadServiceWorkerController) return;
      const toast = document.getElementById('toast');
      let alreadyHealed = true;
      try { alreadyHealed = sessionStorage.getItem(AUTO_HEAL_SESSION_KEY) === '1'; } catch { alreadyHealed = true; }
      const noModalOpen = !document.body.classList.contains('has-modal');
      const onNeutralRoute = location.hash === '' || location.hash === '#home';
      // r37.2.2 (P0, real SHARY incident): a cloud hydration retry closes
      // any open modal and lands on #home right as this listener's safety
      // conditions (no modal, neutral route) become true -- this auto-heal
      // reload used to fire in that exact window, restarting boot mid-sync
      // and throwing the customer back to the public access gate. Never
      // reload while a sync/hydration is actively in flight; defer briefly
      // and only reload once it's genuinely idle (or give up quietly and
      // fall back to the passive "apply on next open" toast).
      const isSyncBusy = () => window.click360SyncStatus?.status === 'syncing';
      const stillSafeToReload = () => !isSyncBusy()
        && !document.body.classList.contains('has-modal')
        && (location.hash === '' || location.hash === '#home');
      const attemptHeal = (attemptsLeft) => {
        if (isSyncBusy() && attemptsLeft > 0) { setTimeout(() => attemptHeal(attemptsLeft - 1), 1000); return; }
        if (!stillSafeToReload()) return;
        if (toast) { toast.textContent = 'Actualizando CLICK 360...'; toast.className = 'toast show ok'; }
        setTimeout(() => {
          // The user may enter a sale/form, or sync may restart during either
          // the retry delay or this final notice. Never reload a new draft.
          if (!stillSafeToReload()) return;
          try {
            if (sessionStorage.getItem(AUTO_HEAL_SESSION_KEY) === '1') return;
            sessionStorage.setItem(AUTO_HEAL_SESSION_KEY, '1');
          } catch { return; }
          window.location.reload();
        }, 900);
      };
      if (!alreadyHealed && noModalOpen && onNeutralRoute) {
        attemptHeal(10);
        return;
      }
      if (!toast) return;
      toast.textContent = 'Actualización lista. Se aplicará al volver a abrir CLICK 360.';
      toast.className = 'toast show ok';
    });
  }
</script>
